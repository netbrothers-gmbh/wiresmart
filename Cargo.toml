[package]
name = "wiresmart"
version = "1.0.0"
edition = "2024"
description = "Linux GUI for managing preconfigured WireGuard tunnels"
license = "GPL-3.0-or-later"
readme = "README.md"
keywords = ["wireguard", "linux", "gui", "vpn"]
categories = ["gui", "network-programming"]

[dependencies]
eframe = "0.33"
image = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
